{% extends "base.html" %}
{% block content %}
<h3 class="mb-4">Select Login Type</h3>
<div class="row g-4">
  <div class="col-md-4">
    <div class="card p-4 text-center">
      <h5>Admin</h5>
      <p class="text-muted small">Manage doctors and system settings.</p>
      <a class="btn btn-dark w-100" href="{{ url_for('auth.admin_login') }}">Admin Login</a>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card p-4 text-center">
      <h5>Doctor</h5>
      <p class="text-muted small">View & complete appointments.</p>
      <a class="btn btn-primary w-100" href="{{ url_for('auth.doctor_login') }}">Doctor Login</a>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card p-4 text-center">
      <h5>Patient</h5>
      <p class="text-muted small">Book & manage appointments.</p>
      <a class="btn btn-success w-100 mb-2" href="{{ url_for('auth.patient_login') }}">Patient Login</a>
      <a class="btn btn-outline-success w-100" href="{{ url_for('auth.patient_register') }}">Register</a>
    </div>
  </div>
</div>
{% endblock %}
